  services:
    filebrowser:
      container_name: filebrowser
      build:
        context: ..
        dockerfile: _docker/Dockerfile
      environment:
        FILEBROWSER_CONFIG: /etc/filebrowser/config.docker.yaml
        FILEBROWSER_DATABASE_PATH: /var/lib/filebrowser/filebrowser.sqlite
        FILEBROWSER_FFMPEG_PATH: /usr/local/bin/
      ports:
        - "8085:8085"

      networks:
        kong-gateway-net:
          aliases:
            - filebrowser

      extra_hosts:
        - "wuan.localhost:host-gateway"
        - "host.docker.internal:host-gateway"

      volumes:
        - "../backend/config.docker.yaml:/etc/filebrowser/config.docker.yaml:ro"
        - "D:/Projects/department-test:/department-test:rw"
        - "D:/Projects/Database-collect/docker-test/filebrowser/data:/var/lib/filebrowser:rw"

      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
        interval: 30s
        timeout: 3s
        start_period: 10s
        retries: 3

      restart: unless-stopped

  networks:
    kong-gateway-net:
      external: true
      name: kong-gateway-net
