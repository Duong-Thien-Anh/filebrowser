  services:
    filebrowser:
      container_name: filebrowser
      image: filebrowser:prod
      environment:
        FILEBROWSER_CONFIG: /etc/filebrowser/config.prod.yaml
        FILEBROWSER_DATABASE_PATH: /var/lib/filebrowser/filebrowser.sqlite
        FILEBROWSER_FFMPEG_PATH: /usr/local/bin/
      ports:
        - "8085:8085"

      networks:
        kong-gateway-net:
          aliases:
            - filebrowser

      volumes:
        - /opt/application/filebrowser/config/config.prod.yml:/etc/filebrowser/config.prod.yaml:ro
        - /opt/application/filebrowser/data:/var/lib/filebrowser:rw
        - /data/filebrowser:/data/filebrowser:rw

      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
        interval: 30s
        timeout: 3s
        start_period: 10s
        retries: 3

      restart: unless-stopped

